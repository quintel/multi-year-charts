version: v1.0
name: Test Collections
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2404
blocks:
  - name: Jest
    task:
      env_vars:
        - name: CI
          value: 'true'
      jobs:
        - name: Test
          commands:
            - checkout
            - sem-version node 20
            - cache restore
            - yarn install --frozen-lockfile
            - cache store
            # Warnings do not fail this: `next lint` exits 0 on them. Add
            # `--max-warnings 0` once the react-hooks/exhaustive-deps and no-img-element
            # warnings on master are cleared.
            - yarn lint
            - npx jest --ci
promotions:
  - name: Deploy to staging
    pipeline_file: deploy_staging.yml
    auto_promote:
      when: result = 'passed' and branch = 'master'
  - name: Deploy to production
    pipeline_file: deploy_production.yml
    auto_promote:
      when: result = 'passed' and branch = 'production'
