version: v1.0
name: Deploy to stable
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2404

# Image tag, deploy path and the NEXT_PUBLIC_* URLs are derived from the branch name and must
# match the instance in the ansible stable group_vars: branch 2027-01 -> image
# quintel/collections:2027_01, deployed from /var/www/collections_2027_01, talking to
# https://2027-01.engine.energytransitionmodel.com and https://2027-01.energytransitionmodel.com.
# NEXT_PUBLIC_* values are inlined into the client bundle at build time, so a URL change requires
# a rebuild here, not a redeploy.
#
# The Sentry release is "stable-<branch>": stable shares its Sentry project with latest.
blocks:
  - name: Docker
    task:
      prologue:
        commands:
          - chmod 0600 ~/.ssh/id_deploy
          - ssh-add ~/.ssh/id_deploy
      env_vars:
        - name: DOCKER_BUILDKIT
          value: '1'
        - name: NEXT_PUBLIC_APP_ENV
          value: production
        # Stable versions authenticate against the production MyETM.
        - name: NEXT_PUBLIC_MYETM_URL
          value: https://my.energytransitionmodel.com
        # Stable shares the production session, so it keeps the bare cookie names and this stays
        # empty. Must equal sso.cookie_suffix in the ansible repo's stable group_vars.
        - name: NEXT_PUBLIC_SSO_COOKIE_SUFFIX
          value: ''
        - name: NEXT_PUBLIC_SENTRY_DSN
          value: https://342f7d0c17687cefeaf0a5d92ff8ed28@o187050.ingest.us.sentry.io/4510793950101504
      jobs:
        - name: 'Build, publish, deploy'
          commands:
            - checkout
            - export TAG="${SEMAPHORE_GIT_BRANCH//-/_}"
            - export NEXT_PUBLIC_ETENGINE_URL="https://${SEMAPHORE_GIT_BRANCH}.engine.energytransitionmodel.com"
            - export NEXT_PUBLIC_ETMODEL_URL="https://${SEMAPHORE_GIT_BRANCH}.energytransitionmodel.com"
            - export NEXT_PUBLIC_SENTRY_RELEASE="stable-${SEMAPHORE_GIT_BRANCH}"
            - echo $DOCKERHUB_PASSWORD | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
            # SENTRY_AUTH_TOKEN comes from the Sentry credentials secret and enters the
            # build as a BuildKit secret (never an ARG/ENV, so it isn't stored in a layer).
            - >-
              docker build
              --secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN
              --build-arg NEXT_PUBLIC_ETENGINE_URL
              --build-arg NEXT_PUBLIC_ETMODEL_URL
              --build-arg NEXT_PUBLIC_MYETM_URL
              --build-arg NEXT_PUBLIC_SSO_COOKIE_SUFFIX
              --build-arg NEXT_PUBLIC_SENTRY_RELEASE
              --build-arg NEXT_PUBLIC_APP_ENV
              --build-arg NEXT_PUBLIC_SENTRY_DSN
              -t quintel/collections:$TAG .
            - docker push quintel/collections:$TAG
            - echo $SSH_FINGERPRINT >> ~/.ssh/known_hosts
            - 'ssh -i ~/.ssh/id_deploy "${SSH_USER}@${SSH_HOST}" -p $SSH_PORT "cd /var/www/collections_$TAG && ./deploy.sh"'
      secrets:
        - name: Docker Hub credentials
        - name: Sentry credentials
        - name: Stable SSH settings
    run:
      when: >-
        branch = '2025-01' or
        branch = '2027-01'
